services:
  postgres:
    image: postgres:17
    container_name: 1xbts-postgres
    ports:
      - "127.0.0.1:45432:5432"
    environment:
      POSTGRES_DB: 1xbts
      POSTGRES_USER: 1xbts
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-1xbts}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U 1xbts -d 1xbts"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  1xbts-web:
    image: node:25-bookworm
    container_name: 1xbts-web
    network_mode: host
    working_dir: /app
    command: sh -c "npm i -g pnpm@11.20.0 && pnpm install --store-dir /pnpm-store && pnpm build && pnpm start --hostname 0.0.0.0"
    environment:
      MSC_GRPC_ADDRESS: ${MSC_GRPC_ADDRESS:-127.0.0.1:17017}
      HLR_GRPC_ADDRESS: ${HLR_GRPC_ADDRESS:-127.0.0.1:17019}
      SMSC_GRPC_ADDRESS: ${SMSC_GRPC_ADDRESS:-127.0.0.1:17020}
      EVENTS_GRPC_ADDRESS: ${EVENTS_GRPC_ADDRESS:-127.0.0.1:17023}
      NODE_OPTIONS: "--max-old-space-size=768"
      WATCHPACK_POLLING: "true"
    volumes:
      - ./1xbts-web:/app
      - 1xbts-web-node-modules:/app/node_modules
      - 1xbts-web-pnpm-store:/pnpm-store
    restart: unless-stopped

  speedtest:
    build:
      context: ./apps/speedtest
    container_name: 1xbts-speedtest
    environment:
      PORT: "5656"
    restart: unless-stopped

  fou-nat:
    build:
      context: .
      dockerfile: docker/fou-nat/Dockerfile
    container_name: 1xbts-fou-nat
    depends_on:
      - speedtest
    privileged: true
    cap_add:
      - NET_ADMIN
      - NET_RAW
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv4.conf.all.rp_filter: "0"
      net.ipv4.conf.default.rp_filter: "0"
    ports:
      - "127.0.0.1:17012:17012/tcp"
      - "127.0.0.1:${SPEEDTEST_PORT:-5656}:80/tcp"
    environment:
      FOU_LISTEN_PORT: "17010"
      FOU_REMOTE_PORT: "17011"
      FOU_TCP_PORT: "17012"
      MOBILE_CIDR: "10.55.0.0/24"
      TUNNEL_ADDR: "10.55.0.1/24"
      FOU_LOCAL_IP: "127.0.0.1"
      SPEEDTEST_UPSTREAM: "http://speedtest:5656"
      LOCAL_DNS_ZONE: "local.1xbts.org"
      UNBOUND_FORWARD_ADDRS: ${UNBOUND_FORWARD_ADDRS:-8.8.8.8}
      # Used by the edge-resolver sidecar to look up subscriber MSISDN
      # via the BSC's PdsnManagementService facade for the X-1xBTS-MSISDN
      # header it injects into MMSC traffic.
      MGMT_GRPC_ADDR: "${MGMT_GRPC_ADDR:-host.docker.internal:17016}"
      # Openwave UP.Link (HDTP) gateway. Comma-separated IP:port endpoints the
      # handset dials for its provisioned proxy are DNAT'd to the local gateway,
      # which browses the web and returns HDML. Set HDTP_ENABLE=0 to disable.
      HDTP_ENABLE: "${HDTP_ENABLE:-1}"
      HDTP_HIJACK_ENDPOINTS: "${HDTP_HIJACK_ENDPOINTS:-153.114.115.100:1905,153.114.116.100:1905}"
      # SessionReply shape, tunable on-air without rebuilding while the exact
      # UP.Browser 3.1 form is pinned down. Layout: sugp | hdtp11 | both.
      # Nonce (which SessionRequest bytes are the C-nonce): last | prev | both.
      HDTP_REPLY_LAYOUT: "${HDTP_REPLY_LAYOUT:-hdtp11}"
      HDTP_REPLY_NONCE: "${HDTP_REPLY_NONCE:-prev}"
      # Content-Type for HDML replies: text/x-hdml | text/hdml | application/x-hdmlc.
      HDTP_CONTENT_TYPE: "${HDTP_CONTENT_TYPE:-text/x-hdml}"
      # Kannel WAP 1.x gateway on the tunnel address, ports 9200/9201. Add a
      # carrier WAP proxy IP:port to WAP_HIJACK_ENDPOINTS to redirect it here.
      # WAP_LOG_LEVEL: 0 debug (very chatty), 1 info, 2 warning, 3 error, 4 panic.
      WAP_ENABLE: "${WAP_ENABLE:-1}"
      WAP_HIJACK_ENDPOINTS: "${WAP_HIJACK_ENDPOINTS:-}"
      WAP_LOG_LEVEL: "${WAP_LOG_LEVEL:-1}"
      # Kannel renders WML but not HTML, so wapbox fetches through a
      # transcoder. Lower WAP_TRANSCODE_MAX_BLOCKS to shorten decks.
      WAP_TRANSCODE_MAX_BLOCKS: "${WAP_TRANSCODE_MAX_BLOCKS:-}"
      WAP_TRANSCODE_LOG: "${WAP_TRANSCODE_LOG:-info}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # Optional MMS profile: enable with `docker compose --profile mms up`.
  # Runs Mbuni MMSC + the in-tree smsc-bridge in one container. Reachable
  # from mobiles at http://mmsc.local.1xbts.org/ via the captive DNS in
  # fou-nat (which forwards local.1xbts.org to docker's embedded DNS).
  mbuni:
    build:
      context: .
      dockerfile: docker/mbuni/Dockerfile
    container_name: 1xbts-mbuni
    profiles: ["mms"]
    networks:
      default:
        aliases:
          - mmsc.local.1xbts.org
    environment:
      MMSC_HOSTNAME: "mmsc.local.1xbts.org"
      MMSC_PORT: "80"
      BRIDGE_BIND_ADDR: "127.0.0.1:8081"
      MSC_GRPC_ADDR: "${MSC_GRPC_ADDR:-host.docker.internal:17017}"
    depends_on:
      - fou-nat
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - mbuni-store:/var/spool/mbuni
    restart: unless-stopped

  # `femto` runs the full femtocell edge. `femto-segw-only` runs just the SeGW.
  femto-segw-config:
    image: 1xbts-femto
    build:
      context: .
      dockerfile: docker/femto/Dockerfile
    container_name: 1xbts-femto-segw-config
    profiles: ["femto", "femto-segw-only"]
    entrypoint: ["/usr/local/bin/cdma-femto-segw-config"]
    environment:
      # Reads the same unified config as femto-core, deriving SeGW connections
      # from its `sites`.
      FEMTO_CONFIG: "/config/femto.json"
      RUST_LOG: "${RUST_LOG:-info}"
    volumes:
      - ./config:/config:ro
      - ./config/femto-segw/swanctl:/etc/1xbts/swanctl
    restart: unless-stopped

  femto-segw:
    build:
      context: .
      dockerfile: docker/femto/segw.Dockerfile
    container_name: 1xbts-femto-segw
    profiles: ["femto", "femto-segw-only"]
    cap_add:
      - NET_ADMIN
      - NET_RAW
    # Only IKE and NAT-T are public. Device-facing services use addresses inside
    # the tunnel because femto-core shares this network namespace.
    ports:
      - "0.0.0.0:500:500/udp"
      - "0.0.0.0:4500:4500/udp"
    # A fixed address on femto-edge so the host route to the FAP pool survives
    # container recreates.
    networks:
      default: {}
      femto-edge:
        ipv4_address: "${FEMTO_SEGW_EDGE_IP:-172.31.0.2}"
    environment:
      FEMTO_SERVICE_IP: "${FEMTO_SERVICE_IP:-10.56.0.2}"
      FEMTO_DNS_IP: "${FEMTO_DNS_IP:-10.56.0.2}"
      FEMTO_DNS_DOMAIN: "${FEMTO_DNS_DOMAIN:-femto.local.1xbts.org}"
      FEMTO_ACS_DOMAIN: "${FEMTO_ACS_DOMAIN:-fsmhdm.femto.spcsdns.net}"
      FEMTO_SIP_DOMAIN: "${FEMTO_SIP_DOMAIN:-fap.airave2.ims.spcsdns.net}"
    volumes:
      - ./config/femto-segw/swanctl:/etc/swanctl:ro
    # femto-core shares this netns, so its host.docker.internal mapping (used to
    # reach the host-run event bus / MSC / HLR gRPC) is declared here.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - femto-segw-config
    restart: unless-stopped

  femto-core:
    image: 1xbts-femto
    build:
      context: .
      dockerfile: docker/femto/Dockerfile
    container_name: 1xbts-femto-core
    profiles: ["femto"]
    # Share the SeGW's network namespace so decrypted traffic is local.
    network_mode: "service:femto-segw"
    environment:
      FEMTO_CONFIG: "/config/femto.json"
      RUST_LOG: "${RUST_LOG:-info}"
      EVENTS_GRPC_ADDR: "${EVENTS_GRPC_ADDR:-host.docker.internal:17023}"
      MSC_GRPC_ADDR: "${MSC_GRPC_ADDR:-host.docker.internal:17017}"
      HLR_GRPC_ADDR: "${HLR_GRPC_ADDR:-host.docker.internal:17019}"
      FEMTO_STATE_DIR: "/var/lib/1xbts/femto"
    volumes:
      # Mount the directory, not the file, so atomic-save edits reach ReloadConfig.
      - ./config:/config:ro
      - femto-state:/var/lib/1xbts/femto
    depends_on:
      - femto-segw
    restart: unless-stopped

  femto-management-proxy:
    image: alpine/socat
    container_name: 1xbts-femto-management-proxy
    profiles: ["femto"]
    command: "tcp-listen:17024,fork,reuseaddr tcp-connect:femto-segw:17024"
    ports:
      - "127.0.0.1:17024:17024"
    depends_on:
      - femto-segw
      - femto-core
    restart: unless-stopped

networks:
  femto-edge:
    driver: bridge
    ipam:
      config:
        - subnet: "${FEMTO_EDGE_SUBNET:-172.31.0.0/24}"

volumes:
  femto-state:
  postgres-data:
  1xbts-web-node-modules:
  1xbts-web-pnpm-store:
  mbuni-store:
