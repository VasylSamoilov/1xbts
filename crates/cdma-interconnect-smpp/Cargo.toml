[package]
name = "cdma-interconnect-smpp"
version = "0.1.0"
edition = "2024"
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "The site's SMPP link to the operator interconnect hub."

[dependencies]
cdma-interconnect = { path = "../cdma-interconnect" }
smpp-core = "0.1"
tokio = { version = "1", features = ["net", "rt", "sync", "time", "macros", "io-util"] }
async-trait = "0.1"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[lib]
path = "src/lib.rs"

[lints]
workspace = true
